<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1640" viewBox="0 0 1240 1640" role="img" aria-labelledby="title"><title id="title">FactoryPulse — États d’interface et composants</title><rect x="0" y="0" width="1240" height="1640" rx="12" fill="#f3f6f5" stroke="#d4dfdc"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="28" fill="#132c2b" font-weight="700">FactoryPulse — États et composants</text><text x="36" y="78" font-family="Arial, sans-serif" font-size="16" fill="#526967" font-weight="400">FC-5 • États statiques destinés à l’import dans Figma • Aucune donnée officielle</text><rect x="36" y="115" width="566" height="302" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="56" y="149" font-family="Arial, sans-serif" font-size="21" fill="#132c2b" font-weight="700">Chargement</text><text x="56" y="191" font-family="Arial, sans-serif" font-size="17" fill="#526967" font-weight="400">Chargement des machines…</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#526967" font-weight="400">Les compteurs ne sont pas encore disponibles.</text><rect x="56" y="248" width="150" height="80" rx="12" fill="#e7eeeb" stroke="#d4dfdc"/><rect x="221" y="248" width="150" height="80" rx="12" fill="#e7eeeb" stroke="#d4dfdc"/><rect x="638" y="115" width="566" height="302" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="658" y="149" font-family="Arial, sans-serif" font-size="21" fill="#132c2b" font-weight="700">Erreur de chargement</text><text x="658" y="191" font-family="Arial, sans-serif" font-size="17" fill="#a52d26" font-weight="400">Impossible de charger les machines.</text><text x="658" y="222" font-family="Arial, sans-serif" font-size="15" fill="#a52d26" font-weight="400">Vérifiez votre connexion puis réessayez.</text><rect x="658" y="270" width="150" height="42" rx="12" fill="#12695c" stroke="#d4dfdc"/><text x="670" y="296" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="600">Réessayer</text><rect x="36" y="445" width="566" height="302" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="56" y="479" font-family="Arial, sans-serif" font-size="21" fill="#132c2b" font-weight="700">Parc vide</text><text x="56" y="521" font-family="Arial, sans-serif" font-size="17" fill="#526967" font-weight="400">Aucune machine dans le parc.</text><text x="56" y="552" font-family="Arial, sans-serif" font-size="15" fill="#526967" font-weight="400">Ajoutez votre première machine.</text><rect x="56" y="600" width="210" height="42" rx="12" fill="#12695c" stroke="#d4dfdc"/><text x="68" y="626" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="600">+ Ajouter une machine</text><rect x="638" y="445" width="566" height="302" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="658" y="479" font-family="Arial, sans-serif" font-size="21" fill="#132c2b" font-weight="700">Aucun résultat</text><text x="658" y="521" font-family="Arial, sans-serif" font-size="17" fill="#526967" font-weight="400">Aucune machine ne correspond aux filtres.</text><text x="658" y="552" font-family="Arial, sans-serif" font-size="15" fill="#526967" font-weight="400">Modifiez la recherche ou réinitialisez.</text><rect x="658" y="600" width="240" height="42" rx="12" fill="#12695c" stroke="#d4dfdc"/><text x="670" y="626" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="600">Réinitialiser les filtres</text><rect x="36" y="775" width="566" height="302" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="56" y="809" font-family="Arial, sans-serif" font-size="21" fill="#132c2b" font-weight="700">Validation du formulaire</text><text x="56" y="851" font-family="Arial, sans-serif" font-size="17" fill="#a52d26" font-weight="400">Nom *</text><text x="56" y="882" font-family="Arial, sans-serif" font-size="15" fill="#a52d26" font-weight="400">Le nom est obligatoire.</text><text x="56" y="913" font-family="Arial, sans-serif" font-size="15" fill="#a52d26" font-weight="400">Production journalière *</text><text x="56" y="944" font-family="Arial, sans-serif" font-size="15" fill="#a52d26" font-weight="400">Saisissez un entier supérieur ou égal à zéro.</text><rect x="56" y="959" width="525" height="44" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="68" y="987" font-family="Arial, sans-serif" font-size="16" fill="#a52d26" font-weight="400">-1</text><text x="56" y="1035" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="400">Conserver la saisie ; ne pas ajouter la machine.</text><rect x="638" y="775" width="566" height="302" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="658" y="809" font-family="Arial, sans-serif" font-size="21" fill="#132c2b" font-weight="700">Confirmation de suppression</text><text x="658" y="851" font-family="Arial, sans-serif" font-size="17" fill="#526967" font-weight="400">Supprimer cette machine ?</text><text x="658" y="882" font-family="Arial, sans-serif" font-size="15" fill="#526967" font-weight="400">Machine : [nom de la machine]</text><text x="658" y="913" font-family="Arial, sans-serif" font-size="15" fill="#526967" font-weight="400">La machine sera retirée du parc de cette session.</text><text x="658" y="944" font-family="Arial, sans-serif" font-size="15" fill="#526967" font-weight="400">Annuler conserve toutes les données.</text><rect x="658" y="995" width="130" height="42" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="670" y="1021" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="600">Annuler</text><rect x="804" y="995" width="180" height="42" rx="12" fill="#a52d26" stroke="#d4dfdc"/><text x="816" y="1021" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="600">Confirmer</text><rect x="36" y="1125" width="1168" height="470" rx="12" fill="#fff" stroke="#d4dfdc"/><text x="56" y="1165" font-family="Arial, sans-serif" font-size="23" fill="#132c2b" font-weight="700">Fondations visuelles et composants réutilisables</text><text x="56" y="1203" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="400">Typographie : Arial / sans-serif • Titres 32 / 25 px • Texte 16 px • Libellés 14 px</text><text x="56" y="1236" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="400">Espacements : 8, 16, 24, 32 px • Rayon 8–12 px • Contrôles 44–46 px</text><rect x="56" y="1258" width="40" height="40" rx="12" fill="#132c2b" stroke="#d4dfdc"/><text x="107" y="1284" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="400">Texte #132c2b</text><rect x="331" y="1258" width="40" height="40" rx="12" fill="#526967" stroke="#d4dfdc"/><text x="382" y="1284" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="400">Secondaire #526967</text><rect x="606" y="1258" width="40" height="40" rx="12" fill="#12695c" stroke="#d4dfdc"/><text x="657" y="1284" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="400">Action #12695c</text><rect x="881" y="1258" width="40" height="40" rx="12" fill="#f3f6f5" stroke="#d4dfdc"/><text x="932" y="1284" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="400">Fond #f3f6f5</text><rect x="56" y="1328" width="340" height="44" rx="12" fill="#e3f1ed" stroke="#d4dfdc"/><text x="70" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="600">En fonctionnement</text><rect x="426" y="1328" width="340" height="44" rx="12" fill="#fff1d6" stroke="#d4dfdc"/><text x="440" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="600">À l'arrêt</text><rect x="796" y="1328" width="340" height="44" rx="12" fill="#fce8e6" stroke="#d4dfdc"/><text x="810" y="1356" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="600">En panne</text><text x="56" y="1414" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="400">États nommés par du texte : la couleur ne porte jamais seule l’information.</text><text x="56" y="1452" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="400">Focus : contour 2 px #12695c, décalage 3 px • Erreurs reliées aux champs.</text><text x="56" y="1490" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="400">Tablette : grille de cartes flexible ; mobile : filtres empilés et largeur disponible.</text><text x="56" y="1528" font-family="Arial, sans-serif" font-size="16" fill="#132c2b" font-weight="400">Sélecteur de statut : En fonctionnement / À l'arrêt / En panne ; filtre avec Tous.</text><text x="56" y="1566" font-family="Arial, sans-serif" font-size="14" fill="#132c2b" font-weight="400">Composants : navigation, carte statistique, carte machine, champ, bouton, message, confirmation.</text></svg>
